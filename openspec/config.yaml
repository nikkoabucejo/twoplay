schema: spec-driven

context: |
  twoplay is a real-time two-player games app: SvelteKit + Svelte 5 runes, Tailwind v4,
  shadcn-svelte, Convex (backend + realtime), Clerk (auth). pnpm. Dark-only UI.
  Project knowledge lives in .agents/skills/twoplay/ (architecture, conventions, backend, games).
  The Convex server is the sole authority: every mutation authenticates via ctx.auth and checks
  room membership; client input is a proposal the server re-validates.
  Verification: `pnpm test` (Vitest: convex, server, client), `pnpm check` (0 errors/0 warnings),
  `pnpm format:check`, `pnpm build`, and live QA in two browsers for user-visible scenarios.
  Orchestrated by /dev:work; tasks are executed by the `engineer` and `designer` agents.

rules:
  proposal:
    - State what is explicitly out of scope
    - Flag any schema change, auth/trust-boundary change, or new public Convex function under Impact
  specs:
    - Every requirement has at least one verifiable WHEN/THEN scenario
    - Server-enforced behavior is specified as server behavior, not as UI behavior
  design:
    - When Convex is touched, include a Trust boundary section (who is authenticated, which room-membership check, what the server re-derives)
    - New fields on existing tables are optional unless a migration is planned
  tasks:
    - Group as "## N. <Area>"; tag every item [engineer] or [designer] and name its files
    - Order server work before client work
    - Mark groups that touch disjoint files as (parallel-safe)
    - Every scenario has a Vitest test task, ordered before its implementation task
    - Final group is Verification — pnpm test, pnpm check, pnpm format:check, pnpm build, live QA

operations:
  apply:
    guidance:
      - Read .agents/skills/twoplay/SKILL.md before editing code
      - Tick tasks in tasks.md as each completes
  archive:
    guidance:
      - Only archive after verifier passes and review findings are resolved
